    <!-- GitHub Pages SPA redirect handler -->
    <script>
      // Single Page App GitHub Pages Redirect Handler
      // This script checks if a redirect is present in the query string
      // and converts it back into the correct URL and replaces the state
      // so the browser's history is not affected.
      (function(l) {
        if (l.search[1] === '/' ) {
          var decoded = l.search.slice(1).split('&').map(function(s) { 
            return s.replace(/~and~/g, '&')
          }).join('?');
          window.history.replaceState(null, null,
              l.pathname.slice(0, -1) + decoded + l.hash
          );
        }
      }(window.location))
    </script>
